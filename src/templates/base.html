<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ChatGay.cl{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="star-canvas"></div>
    <div class="rainbow-divider"></div>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand" href="/">CHATGAY.CL ✨</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto align-items-center text-center">
                    <li class="nav-item m-1"><a class="nav-link px-3 rounded-pill rainbow-hover" href="/">Inicio</a></li>
                    <li class="nav-item m-1"><a class="nav-link px-3 rounded-pill rainbow-hover" href="/foros">Foros</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-2">
        <a href="/contacto-publicidad" class="ad-slot ad-banner-top rainbow-hover">
            <span class="ad-label">TOP AD</span>
            <span class="ad-title">ANUNCIA AQUÍ</span>
        </a>
    </div>

    <main class="container-fluid px-2 my-1 flex-grow-1">
        <div class="row tight-row">
            <div class="col-lg-2 d-none d-lg-block">
                <a href="/contacto-publicidad" class="ad-slot ad-sidebar rainbow-hover">
                    <span class="ad-label">SIDE AD</span>
                    <span class="ad-title">IZQUIERDA</span>
                </a>
            </div>
            <div class="col-lg-8">
                {% block content %}{% endblock %}
            </div>
            <div class="col-lg-2 d-none d-lg-block">
                <a href="/contacto-publicidad" class="ad-slot ad-sidebar rainbow-hover">
                    <span class="ad-label">SIDE AD</span>
                    <span class="ad-title">DERECHA</span>
                </a>
            </div>
        </div>
    </main>

    <div class="container-fluid px-2">
        <a href="/contacto-publicidad" class="ad-slot ad-footer rainbow-hover">
            <span class="ad-label">BOTTOM AD</span>
            <span class="ad-title">MÁS INFORMACIÓN</span>
        </a>
    </div>

    <footer>
        <div class="container-fluid px-4">
            <div class="d-flex flex-column align-items-center justify-content-center text-center">
                <div class="social-container">
                    <a href="#" class="social-btn rainbow-hover">FB</a>
                    <a href="#" class="social-btn rainbow-hover">IG</a>
                    <a href="#" class="social-btn rainbow-hover">TK</a>
                </div>
                <div class="d-flex flex-wrap justify-content-center align-items-center gap-3 mb-2">
                    <a href="#" class="footer-link px-2 py-1 rounded rainbow-hover">Términos</a>
                    <a href="#" class="footer-link px-2 py-1 rounded rainbow-hover">Privacidad</a>
                    <a href="/contacto-publicidad" class="footer-link px-2 py-1 rounded rainbow-hover">Publicidad</a>
                </div>
                <span class="small text-secondary opacity-50">© 2026 <b>ChatGay.cl</b></span>
            </div>
        </div>
        <div class="rainbow-divider mt-3" style="height: 1px; opacity: 0.15;"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const spawnStar = (e) => {
            const canvas = document.getElementById('star-canvas');
            const star = document.createElement('div');
            star.className = 'magic-star';
            
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Tamaño pequeño y fijo para minimalismo (4px)
            star.style.width = '4px'; 
            star.style.height = '4px';
            star.style.left = x + 'px'; 
            star.style.top = y + 'px';
            
            // Colores Arcoíris sutiles
            const hue = Math.random() * 360;
            const color = `hsl(${hue}, 100%, 75%)`;
            star.style.background = color;
            star.style.boxShadow = `0 0 10px ${color}`;
            
            canvas.appendChild(star);
            
            // Desaparece rápido para no molestar (800ms)
            setTimeout(() => star.remove(), 800);
        };
        
        document.addEventListener('mousemove', spawnStar);
        document.addEventListener('touchmove', spawnStar);
    </script>
</body>
</html>
